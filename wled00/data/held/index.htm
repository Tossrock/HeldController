<!DOCTYPE html>
<!-- AI: below section was generated by an AI -->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#120806">
	<title>Held</title>
	<!-- three.js for the optional WebGL view (view3d_gl.js); only fetched when online. Keep the version in sync with THREE_BASE there. -->
	<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
	<link rel="stylesheet" href="held.css">
</head>
<body>
	<header id="top">
		<div class="brand">Held <span id="mode" class="badge">SIM</span></div>
		<div class="transport">
			<button id="play" class="icon" title="Play / pause">❚❚</button>
			<select id="speed" title="Time scale (simulation speed)">
				<option value="0.25">¼×</option>
				<option value="0.5">½×</option>
				<option value="1" selected>1×</option>
				<option value="2">2×</option>
				<option value="4">4×</option>
			</select>
			<label class="bri" title="Global brightness">☀<input id="bri" type="range" min="1" max="255" value="128"></label>
		</div>
	</header>

	<main>
		<section id="stage">
			<div id="viewWrap">
				<canvas id="view"></canvas>
				<div id="viewTools">
					<button id="srcBtn" class="chip" title="Show the device's real LEDs or the local simulation" hidden>Live</button>
					<button id="rotBtn" class="chip on" title="Auto-rotate">⟳</button>
					<button id="glowBtn" class="chip on" title="Glow">✺</button>
					<button id="shellBtn" class="chip on" title="Show the heart">◯</button>
					<button id="frontBtn" class="chip" title="Reset view">⌂</button>
				</div>
				<div id="pick" hidden></div>
			</div>
			<canvas id="kymo" title="Time runs downward: each row is one frame of every strip, newest at the top"></canvas>
			<div id="status">
				<div class="lvl"><span>Level</span><div class="bar"><i id="lvlBar"></i></div><b id="lvlTxt">0.00</b></div>
				<div id="readout"></div>
				<div id="linkTxt" class="muted small" hidden></div>
				<div id="evList"></div>
			</div>
		</section>

		<section id="side">
			<div class="card">
				<div class="cardHead"><h3>Pieces</h3><span id="pcTxt" class="muted"></span></div>
				<div id="pieces"></div>
				<div class="row">
					<button id="allInBtn">All in</button>
					<button id="allOutBtn">All out</button>
				</div>
			</div>

			<div class="card">
				<div class="cardHead"><h3>Trigger event</h3><button id="clearEv" class="link">clear</button></div>
				<div class="row">
					<button data-trig="pieceIn">Piece in</button>
					<button data-trig="pieceOut">Piece removed</button>
					<button data-trig="allIn" class="accent">Last piece</button>
					<button data-trig="storyEnd">Story end</button>
				</div>
				<p class="muted small">Triggers play the event without changing the piece count. Toggling pieces above triggers them automatically.</p>
			</div>

			<nav id="tabs"></nav>
			<div id="panel" class="card"></div>

			<div class="card">
				<div class="row">
					<button id="saveBtn" class="accent">Save</button>
					<button id="revertBtn">Reload</button>
					<button id="exportBtn">Export</button>
					<button id="importBtn">Import</button>
					<input id="importFile" type="file" accept=".json,application/json" hidden>
				</div>
				<p id="saveNote" class="muted small"></p>
			</div>
		</section>
	</main>

	<div id="toast"></div>

	<script src="schema.js"></script>
	<script src="expr.js"></script>
	<script src="engine.js"></script>
	<script src="view3d.js"></script>
	<script src="view3d_gl.js"></script>
	<script src="app.js"></script>
</body>
</html>
<!-- AI: end -->
